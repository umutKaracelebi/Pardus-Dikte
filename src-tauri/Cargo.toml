[package]
name = "pardus-dikte"
version = "1.0.0"
description = "Pardus Dikte - Yapay Zeka Destekli Sesli Yazı Asistanı"
authors = ["İnoTürk <inoturkteknolojitakimi@gmail.com>"]
license = "GPL-3.0"
homepage = "https://inoturk.netlify.app/"
repository = "https://github.com/umutKaracelebi/Pardus-Dikte"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pardus_dikte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
enigo = "0.6.1"
rdev = "0.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gtk = "0.18"
